global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "cognition_gateway"
    scrape_interval: 5s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway:8000"]

  - job_name: "cognition_analytics"
    scrape_interval: 5s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["analytics:8002"]
