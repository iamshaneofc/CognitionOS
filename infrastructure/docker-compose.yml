version: '3.8'

services:
  gateway:
    build:
      context: ../
      dockerfile: infrastructure/docker/Dockerfile.gateway
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://cognition_admin:cognition_secure_pass@postgres:5432/cognition_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"

  worker:
    build:
      context: ../
      dockerfile: infrastructure/docker/Dockerfile.worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://cognition_admin:cognition_secure_pass@postgres:5432/cognition_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - chromadb

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=cognition_admin
      - POSTGRES_PASSWORD=cognition_secure_pass
      - POSTGRES_DB=cognition_db
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
