version: "3.8"

services:
  # Relational database for structured profiles, telemetry metadata, and compliance logs
  db:
    image: postgres:16-alpine
    container_name: cognition_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-cognition_admin}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cognition_secure_pass}
      POSTGRES_DB: ${DATABASE_NAME:-cognition_db}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  # In-memory store for session caching, transient queue streams, and rate limit tracking
  redis:
    image: redis:7-alpine
    container_name: cognition_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vector database for semantic context retrieval, user memory embeddings, and RAG
  chroma:
    image: chromadb/chroma:latest
    container_name: cognition_chroma
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data

  # Observability - Metrics Ingest
  prometheus:
    image: prom/prometheus:latest
    container_name: cognition_prometheus
    restart: unless-stopped
    volumes:
      - ../config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - db
      - redis

  # Observability - Analytics Visualizer Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: cognition_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # MLflow server for monitoring model versions, parameters, and training metrics
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: cognition_mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --default-artifact-root /mlflow-artifacts
    volumes:
      - mlflow_data:/mlflow-artifacts

  # System API Gateway (FastAPI downstream entrypoint router)
  gateway:
    build:
      context: ../
      dockerfile: infrastructure/docker/Dockerfile.gateway
    container_name: cognition_gateway
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DATABASE_URL=postgresql+asyncpg://${DATABASE_USER:-cognition_admin}:${DATABASE_PASSWORD:-cognition_secure_pass}@db:5432/${DATABASE_NAME:-cognition_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - CHROMA_HOST=chroma
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  grafana_data:
  mlflow_data:
